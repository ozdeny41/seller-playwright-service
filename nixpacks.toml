providers = ["node"]

[variables]
NODE_VERSION = "20"

[phases.setup]

[phases.install]
cmds = [
  "npm install",
  "echo '=== INSTALLING PLAYWRIGHT BROWSERS ==='",
  "npx playwright install chromium --with-deps",
  "echo '=== VERIFYING PLAYWRIGHT CHROMIUM ==='",
  "ls -la $HOME/.cache/ms-playwright/chromium* 2>/dev/null | head -5 || echo '⚠️ Playwright cache directory not found'",
  "echo '=== PLAYWRIGHT INSTALLATION COMPLETE ==='",
  "echo '=== CHECKING CHROMIUM EXECUTABLE ==='",
  "find $HOME/.cache/ms-playwright -name 'chrome-headless-shell' -type f 2>/dev/null | head -1 || echo '⚠️ Chromium executable not found'"
]

[phases.build]
cmds = [
  "echo '✅ Playwright Service build complete'"
]

[start]
cmd = "npm start"
