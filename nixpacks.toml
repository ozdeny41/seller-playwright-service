providers = ["node"]

[variables]
NODE_VERSION = "20"

[phases.setup]

[phases.install]
cmds = [
  "npm install",
  "echo '=== INSTALLING PLAYWRIGHT BROWSERS ==='",
  "PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium --with-deps || echo '⚠️ Playwright browser install failed, continuing...'",
  "echo '=== VERIFYING PLAYWRIGHT CHROMIUM ==='",
  "ls -la $HOME/.cache/ms-playwright/ 2>/dev/null || echo '⚠️ Playwright cache directory not found'",
  "ls -la node_modules/.cache/playwright/ 2>/dev/null || echo '⚠️ Playwright node_modules cache not found'",
  "echo '=== PLAYWRIGHT INSTALLATION COMPLETE ==='"
]

[phases.build]
cmds = [
  "echo '✅ Playwright Service build complete'"
]

[start]
cmd = "npm start"
